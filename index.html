<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cozy Fire Pit</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#050505;
}

.fireplace{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,
        rgba(255,120,0,.15) 0%,
        rgba(255,80,0,.08) 25%,
        transparent 60%),
        #050505;
}

.fire{
    position:relative;
    width:260px;
    height:320px;
}

.flame{
    position:absolute;
    bottom:60px;
    left:50%;
    transform-origin:center bottom;
    border-radius:50% 50% 30% 30%;
    filter:blur(2px);
}

.flame1{
    width:120px;
    height:180px;
    margin-left:-60px;
    background:linear-gradient(
        to top,
        #ff3c00,
        #ff8c00,
        #ffd348
    );
    animation:flicker1 2s infinite ease-in-out;
}

.flame2{
    width:90px;
    height:145px;
    margin-left:-45px;
    background:linear-gradient(
        to top,
        #ff9d00,
        #ffd75a,
        #fff2bd
    );
    animation:flicker2 1.5s infinite ease-in-out;
}

.flame3{
    width:55px;
    height:105px;
    margin-left:-27px;
    background:linear-gradient(
        to top,
        #fff0b8,
        #ffffff
    );
    animation:flicker3 1s infinite ease-in-out;
}

.logs{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
}

.log{
    position:absolute;
    width:140px;
    height:18px;
    background:#5a3a22;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.5);
}

.log1{transform:rotate(25deg);}
.log2{transform:rotate(-25deg);}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:radial-gradient(
      circle,
      rgba(255,160,50,.4),
      transparent 70%
    );
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    animation:pulse 4s infinite;
}

@keyframes flicker1{
    0%,100%{transform:translateX(-50%) scale(1);}
    25%{transform:translateX(-48%) scale(1.08);}
    50%{transform:translateX(-52%) scale(.94);}
    75%{transform:translateX(-49%) scale(1.05);}
}

@keyframes flicker2{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-48%) scale(1.08);}
}

@keyframes flicker3{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-51%) scale(.9);}
}

@keyframes pulse{
    50%{opacity:.7;transform:translateX(-50%) scale(1.08);}
}
</style>
</head>
<body>

<div class="fireplace">
    <div class="fire">
        <div class="glow"></div>
        <div class="flame flame1"></div>
        <div class="flame flame2"></div>
        <div class="flame flame3"></div>

        <div class="logs">
            <div class="log log1"></div>
            <div class="log log2"></div>
        </div>
    </div>
</div>

<audio id="fireAudio"
       loop
       autoplay
       preload="auto">
    <source src="fireplace-ambience.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('fireAudio');

audio.play().catch(() => {
    document.addEventListener('click', () => {
        audio.play();
    }, { once:true });
});
</script>

</body>
</html>
