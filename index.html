<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Fireplace</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* Fireplace Video */
#fire {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;
}

/* Start Overlay */
#overlay {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(2px);

    cursor: pointer;
    transition: opacity 1s ease;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
}

#overlay.hidden {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<video
    id="fire"
    autoplay
    muted
    loop
    playsinline>
    <source src="fire.mp4" type="video/mp4">
</video>

<audio
    id="audio"
    loop>
    <source src="fireplace.mp3" type="audio/mpeg">
</audio>

<div id="overlay">
    Click Anywhere To Start Fireplace
</div>

<script>
const audio = document.getElementById("audio");
const overlay = document.getElementById("overlay");

document.addEventListener("click", async () => {
    try {
        await audio.play();
        overlay.classList.add("hidden");
    } catch (err) {
        console.log(err);
    }
}, { once: true });
</script>

</body>
</html>
